version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  backend:
    build: .
    container_name: backend-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/muchtodo
    depends_on:
      - mongodb
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
- app-network
